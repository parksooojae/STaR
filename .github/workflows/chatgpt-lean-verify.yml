name: ChatGPT Lean Verify

on:
  push:
    branches:
      - chatgpt-lean-verify-bessel
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean and build proof
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean_verify
          build-args: verify
